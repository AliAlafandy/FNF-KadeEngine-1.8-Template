name: Main

on:
  workflow_dispatch:
    inputs:
      buildDesktop:
        description: "Build Windows (x64 and x32), Linux and MacOS"
        type: boolean
        default: true

      buildMobile:
        description: "Build Android (x64 and x32) and iOS"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  Desktop:
    name: ${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buildDesktop }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            buildArgs: windows
            artifactName: Windows-x64
            artifactPath: export/release/windows/bin/*

          - name: Windows x32
            os: windows-2022
            buildArgs: "windows -32 -D HXCPP_M32 -D 32bits"
            artifactName: Windows-x32
            artifactPath: export/32bit/windows/bin/*

          - name: Linux
            os: ubuntu-24.04
            buildArgs: linux
            artifactName: Linux
            artifactPath: export/release/linux/bin/*

          - name: MacOS
            os: macos-14
            buildArgs: mac
            artifactName: MacOS
            artifactPath: export/release/macos/bin/*

    uses: ./.github/workflows/build.yml

    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}

  Mobile:
    name: ${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buildMobile }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Android x64
            os: macos-14
            buildArgs: "android -ONLY_ARM64"
            artifactName: Android x64
            artifactPath: export/release/android/bin/app/build/outputs/apk/release/*.apk

          - name: Android x32
            os: macos-14
            buildArgs: "android -ONLY_ARMV7"
            artifactName: Android x32
            artifactPath: export/release/android/bin/app/build/outputs/apk/release/*.apk

          - name: iOS
            os: macos-14
            buildArgs: "ios -nosign"
            artifactName: iOS
            artifactPath: export/release/ios/build/Release-iphoneos/*.ipa

    uses: ./.github/workflows/build.yml

    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}
      
