name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
    secrets:
      androidKeystoreBase64:
        required: false
      androidKeystorePassword:
        required: false
      androidKeyAlias:
        required: false

env:
  HAXE_VERSION: 4.3.7
  LIME_VERSION: 8.3.2
  PROJECT_NAME: KadeEngine
  ANDROID_NDK_VERSION: 27.1.12297006
  ANDROID_PLATFORM_VERSION: "34"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install hmm
        shell: bash
        run: haxelib install hmm --quiet

      - name: Install dependencies via hmm
        shell: bash
        run: haxelib run hmm install

      - name: Setup Lime
        shell: bash
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime setup flixel

      - name: Update APT
        if: inputs.name == 'Linux'
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update --fix-missing

      - name: Install libVLC
        if: inputs.name == 'Linux'
        run: sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Setup XCode
        if: inputs.name == 'iOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Setup JDK
        if: contains(inputs.name, 'Android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: contains(inputs.name, 'Android')
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM_VERSION }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}
            cmdline-tools;latest

      - name: Cache Gradle
        if: contains(inputs.name, 'Android')
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ inputs.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ inputs.os }}-

      - name: Set version from run number
        shell: bash
        run: |
          BASE_VERSION=$(grep -oE 'version="[0-9.]+"' Project.xml | head -1 | grep -oE '[0-9.]+')
          NEW_VERSION="${BASE_VERSION}.${{ github.run_number }}"
          sed -i.bak "s/version=\"${BASE_VERSION}\"/version=\"${NEW_VERSION}\"/" Project.xml
          rm -f Project.xml.bak
          echo "BUILD_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Decode Android keystore
        if: contains(inputs.name, 'Android')
        env:
          KEYSTORE_BASE64: ${{ secrets.androidKeystoreBase64 }}
          KEYSTORE_ALIAS: ${{ secrets.androidKeyAlias }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            sed -i.bak "s/ANDROID_KEY_ALIAS_PLACEHOLDER/$KEYSTORE_ALIAS/" Project.xml
            rm -f Project.xml.bak
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

      - name: Rebuild extension-webm
        if: "!contains(inputs.name, 'Android') && inputs.name != 'iOS'"
        shell: bash
        run: haxelib run lime rebuild extension-webm ${{ inputs.buildArgs }}

      - name: Configure Android SDK/NDK/JDK for Lime
        if: contains(inputs.name, 'Android')
        shell: bash
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.androidKeystorePassword }}
        shell: bash
        run: |
          if [ "$HAS_KEYSTORE" == "true" ]; then
            haxelib run lime build ${{ inputs.buildArgs }} --certificate-password="$KEYSTORE_PASSWORD"
          else
            haxelib run lime build ${{ inputs.buildArgs }}
          fi

      - name: Clean up keystore
        if: always() && contains(inputs.name, 'Android')
        shell: bash
        run: rm -f release.keystore

      - name: Make IPA
        if: inputs.name == 'iOS'
        shell: bash
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }} (${{ env.BUILD_VERSION }})
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
          retention-days: 14
