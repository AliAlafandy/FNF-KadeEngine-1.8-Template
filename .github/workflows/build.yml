name: Build

on:
  workflow_call:
    inputs:
      name:
        description: "Build Name"
        required: true
        type: string

      os:
        description: "GitHub Actions Runner"
        required: true
        type: string

      buildArgs:
        description: "Lime build Arguments"
        required: true
        type: string

      artifactName:
        description: "Artifact Name"
        required: true
        type: string

      artifactPath:
        description: "Artifact Path"
        required: true
        type: string

env:
  HAXE_VERSION: "4.1.5"
  PROJECT_NAME: "KadeEngine"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

  ANDROID_NDK_VERSION: "21.4.7075529"
  ANDROID_PLATFORM: "android-30"
  ANDROID_BUILD_TOOLS: "30.0.3"

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Update APT
        if: inputs.name == 'Linux'
        shell: bash
        run: |
          sudo apt-get update

      - name: Install Linux Dependencies
        if: inputs.name == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y \
            libvlc-dev \
            libvlccore-dev \
            libvlc5 \
            libvlccore9

      - name: Setup XCode
        if: inputs.name == 'iOS'
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: "16.4"

      - name: Setup Android
        if: startsWith(inputs.name, 'Android')
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        if: startsWith(inputs.name, 'Android')
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Configure Android Environment
        if: startsWith(inputs.name, 'Android')
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"

          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Install Haxe Libraries
        shell: bash
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Show build Environment
        shell: bash
        run: |
          echo "=========================================="
          echo "Build: ${{ inputs.name }}"
          echo "OS: ${{ inputs.os }}"
          echo "Arguments: ${{ inputs.buildArgs }}"
          echo "=========================================="

          haxe --version

          echo "------------------------------------------"
          echo "Haxelib"
          echo "------------------------------------------"

          haxelib list

          if [[ "${{ inputs.name }}" == Android* ]]; then
            echo "------------------------------------------"
            echo "Android"
            echo "------------------------------------------"

            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
            echo "JAVA_HOME=$JAVA_HOME"

            "$ANDROID_HOME/platform-tools/adb" version || true
          fi

      - name: Compile
        shell: bash
        run: |
          set -e

          echo "Building ${{ inputs.name }}"

          haxelib run lime build ${{ inputs.buildArgs }}

      - name: Create iOS IPA
        if: inputs.name == 'iOS'
        shell: bash
        run: |
          set -e

          IOS_DIR="export/release/ios/build/Release-iphoneos"

          if [ ! -d "$IOS_DIR" ]; then
            echo "ERROR: iOS output directory was not created:"
            echo "$IOS_DIR"
            exit 1
          fi

          cd "$IOS_DIR"

          APP_FILE=$(find . -maxdepth 1 -type d -name "*.app" -print -quit)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: No .app bundle was produced."
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          mv "$APP_FILE" Payload/

          zip -r "${PROJECT_NAME}.ipa" Payload

          echo "Created:"
          ls -lh "${PROJECT_NAME}.ipa"

      - name: Verify Android APK
        if: startsWith(inputs.name, 'Android')
        shell: bash
        run: |
          set -e

          APK_DIR="export/release/android/bin/app/build/outputs/apk/release"

          echo "Checking Android output:"
          echo "$APK_DIR"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Android output directory does not exist."
            exit 1
          fi

          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print

          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
          retention-days: 14
