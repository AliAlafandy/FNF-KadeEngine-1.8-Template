name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.7
  LIME_VERSION: 8.3.2
  PROJECT_NAME: KadeEngine
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Resolve haxelib path
        shell: bash
        run: |
          HAXELIB_DIR="$HOME/haxelib"
          mkdir -p "$HAXELIB_DIR"
          haxelib setup "$HAXELIB_DIR"
          echo "HAXELIB_ROOT=$HAXELIB_DIR" >> "$GITHUB_ENV"

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ${{ env.HAXELIB_ROOT }}
          key: haxelib-${{ inputs.os }}-${{ env.HAXE_VERSION }}-${{ hashFiles('**/hmm.json') }}
          restore-keys: |
            haxelib-${{ inputs.os }}-${{ env.HAXE_VERSION }}-

      - name: Update APT
        if: inputs.name == 'Linux'
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update --fix-missing

      - name: Install libVLC
        if: inputs.name == 'Linux'
        run: sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Setup XCode
        if: inputs.name == 'iOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install hmm
        shell: bash
        run: haxelib install hmm --quiet

      - name: Install dependencies via hmm
        shell: bash
        run: haxelib run hmm install

      - name: Setup Lime
        shell: bash
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime setup flixel

      - name: Rebuild extension-webm
        if: inputs.name != 'Android x64' && inputs.name != 'Android x32' && inputs.name != 'iOS'
        shell: bash
        run: haxelib run lime rebuild extension-webm ${{ inputs.buildArgs }}

      - name: Configure Android x64
        if: inputs.name == 'Android x64'
        shell: bash
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_LATEST_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_arm64"
          haxelib run lime config ANDROID_SETUP true

      - name: Configure Android x32
        if: inputs.name == 'Android x32'
        shell: bash
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_LATEST_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_arm64"
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        shell: bash
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Make IPA
        if: inputs.name == 'iOS'
        shell: bash
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
          retention-days: 14
